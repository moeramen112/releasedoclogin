<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Release Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #f1f4f3; --surface: #ffffff; --surface-2: #f6f8f7; --ink: #15201c; --muted: #5a6a64; --line: #d8e0dc;
  --accent: #0e6b5c; --accent-ink: #ffffff;
  --good: #1b7a49; --good-bg: #e0f2e8; --warn: #8f5a00; --warn-bg: #fbefd2;
  --bad: #b3261e; --bad-bg: #fbe2df; --pend: #3f56a0; --pend-bg: #e3e8f7; --waive: #6a4a8c; --waive-bg: #ece3f5;
  --font-body: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1412; --surface: #151f1c; --surface-2: #1b2723; --ink: #e6efeb; --muted: #93a59e; --line: #2a3a35;
    --accent: #4fc3ab; --accent-ink: #082019;
    --good: #5fd38f; --good-bg: #173326; --warn: #f0b84d; --warn-bg: #3a2c0e;
    --bad: #ff8a80; --bad-bg: #3d1a17; --pend: #9db0ee; --pend-bg: #1d2644; --waive: #c9a8ee; --waive-bg: #2c2040;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1412; --surface: #151f1c; --surface-2: #1b2723; --ink: #e6efeb; --muted: #93a59e; --line: #2a3a35;
  --accent: #4fc3ab; --accent-ink: #082019;
  --good: #5fd38f; --good-bg: #173326; --warn: #f0b84d; --warn-bg: #3a2c0e;
  --bad: #ff8a80; --bad-bg: #3d1a17; --pend: #9db0ee; --pend-bg: #1d2644; --waive: #c9a8ee; --waive-bg: #2c2040;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-body); padding: 20px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
a { color: var(--accent); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
.title h1 { font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
.title .sub { color: var(--muted); font-size: 12px; margin-top: 4px; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { font-family: var(--font-data); font-size: 11px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); background: var(--surface); }
.tag.sample { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
.tag.on { color: var(--good); border-color: var(--good); }
.tag.err { color: var(--bad); border-color: var(--bad); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.note { color: var(--muted); font-size: 12px; }

.controls { flex-direction: row; flex-wrap: wrap; align-items: flex-end; gap: 12px; }
.controls label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; flex: 1 1 150px; min-width: 0; }
.controls input, .form input, .form textarea { text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 400; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; min-width: 0; }
.controls input:disabled { opacity: .5; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface-2); padding: 7px 12px; font-size: 13px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 11px; font-size: 13px; font-weight: 500; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { color: var(--accent-ink); filter: brightness(1.08); }
.btn.small { padding: 3px 9px; font-size: 12px; }

#banner:empty { display: none; }
.banner { border: 1px solid var(--warn); background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; }
.banner.bad { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.banner ul { margin: 0; padding-left: 18px; }

.verdict { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; display: grid; grid-template-columns: minmax(220px, 300px) 1fr; overflow: hidden; }
.v-badge { padding: 20px 22px; display: flex; flex-direction: column; gap: 6px; justify-content: center; min-width: 0; }
.v-badge .label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; opacity: .85; }
.v-badge .word { font-family: var(--font-data); font-size: 40px; font-weight: 600; line-height: 1; letter-spacing: -.02em; }
.v-badge.nogo { background: var(--bad-bg); color: var(--bad); }
.v-badge.hold { background: var(--warn-bg); color: var(--warn); }
.v-badge.go { background: var(--good-bg); color: var(--good); }
.v-body { padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.tally { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-data); font-size: 12px; padding: 3px 9px; border-radius: 999px; font-weight: 500; white-space: nowrap; }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }
.s-pass { color: var(--good); background: var(--good-bg); }
.s-warn { color: var(--warn); background: var(--warn-bg); }
.s-fail { color: var(--bad); background: var(--bad-bg); }
.s-pending { color: var(--pend); background: var(--pend-bg); }
.s-waived { color: var(--waive); background: var(--waive-bg); }
.holding h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
.holding ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.holding li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.holding li .mono { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.progress { height: 8px; border-radius: 4px; background: var(--surface-2); display: flex; overflow: hidden; border: 1px solid var(--line); }
.progress span, .bar span { display: block; height: 100%; }
.p-pass { background: var(--good); } .p-warn { background: var(--warn); } .p-fail { background: var(--bad); } .p-pending { background: var(--pend); } .p-waived { background: var(--waive); }

.criteria { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 10px; }
.crit { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px; background: var(--surface-2); min-width: 0; }
.crit .row1 { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.crit .name { font-weight: 600; }
.crit .detail { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.crit .waiver-note { font-size: 12px; color: var(--waive); background: var(--waive-bg); border-radius: 6px; padding: 6px 8px; }
.crit .waiver-note.stale { color: var(--bad); background: var(--bad-bg); }
.crit .foot { display: flex; flex-direction: column; gap: 6px; margin-top: 2px; }
.crit .src { font-family: var(--font-data); font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.crit .btns { display: flex; gap: 6px; flex-wrap: wrap; }
.form { display: flex; flex-direction: column; gap: 6px; border-top: 1px dashed var(--line); padding-top: 8px; }
.form label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; display: flex; flex-direction: column; gap: 3px; }
.form textarea { resize: vertical; min-height: 54px; }
.form .err { color: var(--bad); font-size: 12px; }
.form .row { display: flex; gap: 6px; }

.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 10px; font-family: var(--font-data); font-size: 12px; }
.filters button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.t { min-width: 200px; }
td .id { font-family: var(--font-data); font-size: 12px; color: var(--muted); display: block; }
.empty { color: var(--muted); padding: 8px 0; }
.sev { font-family: var(--font-data); font-weight: 600; font-size: 12px; padding: 2px 7px; border-radius: 4px; }
.sev-P0 { background: var(--bad); color: var(--bg); }
.sev-P1 { background: var(--warn-bg); color: var(--warn); }
.sev-P2 { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.num { text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; padding-right: 0; white-space: nowrap; }

.appr-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; }
.appr-row:last-child { border-bottom: 0; }

.stage { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: center; margin-bottom: 10px; }
.stage .val { font-family: var(--font-data); font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.bar { height: 10px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); display: flex; overflow: hidden; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-top: 6px; }
.stat { display: flex; flex-direction: column; }
.stat b { font-family: var(--font-data); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.failnames { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--font-data); font-size: 11px; fill: var(--muted); }
@media (max-width: 560px) { .verdict { grid-template-columns: 1fr; } .stage { grid-template-columns: 1fr auto; } .stage .bar { grid-column: 1 / -1; order: 3; } }
@media (prefers-reduced-motion: no-preference) { .progress span, .bar span { transition: width .3s ease; } }

/* ---------- navigation ---------- */
.nav { display: flex; gap: 4px; }
.nav a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: 13px; padding: 5px 11px; border-radius: 6px; border: 1px solid transparent; }
.nav a:hover { color: var(--ink); border-color: var(--line); }
.nav a[aria-current="page"] { color: var(--accent-ink); background: var(--accent); }

/* ---------- planner ---------- */
.sumbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 11; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.sumbar .call { font-family: var(--font-data); font-weight: 600; font-size: 15px; padding: 3px 10px; border-radius: 6px; }
.sumbar .call.nogo { background: var(--bad-bg); color: var(--bad); }
.sumbar .call.hold { background: var(--warn-bg); color: var(--warn); }
.sumbar .call.go { background: var(--good-bg); color: var(--good); }
.sumbar .kv { display: flex; flex-direction: column; line-height: 1.15; }
.sumbar .kv b { font-family: var(--font-data); font-size: 14px; font-variant-numeric: tabular-nums; }
.sumbar .kv span { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.sumbar .spacer { flex: 1 1 auto; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; }

.plan { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.plan > .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.results { position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow-y: auto; padding-right: 2px; }
@media (max-width: 1100px) { .plan { grid-template-columns: minmax(0, 1fr); } .results { position: static; max-height: none; overflow: visible; } }

.sec-head { display: flex; flex-direction: column; gap: 2px; }
.sec-head .hint { color: var(--muted); font-size: 12px; text-transform: none; letter-spacing: 0; font-weight: 400; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); gap: 10px 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field > label, .field > .lab { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.field input[type="text"], .field input[type="number"], .field input[type="datetime-local"], .field select, .field textarea,
.tbl input[type="text"], .tbl input[type="number"], .tbl input[type="datetime-local"], .tbl select {
  font: inherit; font-size: 13px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; min-width: 0;
}
.field textarea { resize: vertical; min-height: 58px; line-height: 1.4; }
.field .mono, .tbl .mono { font-family: var(--font-data); font-size: 12px; }
.field .suffix { font-size: 11px; color: var(--muted); }
.field .help { font-size: 11px; color: var(--muted); }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; padding-top: 2px; }
.checks label { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; text-transform: none; letter-spacing: 0; color: var(--ink); font-weight: 400; }
.checks input { width: 16px; height: 16px; accent-color: var(--accent); }
.inline { display: flex; gap: 8px; align-items: flex-end; }
.inline > :first-child { flex: 1 1 auto; min-width: 0; }
.signoff { display: grid; grid-template-columns: minmax(72px, 0.5fr) minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 3px 0; }
.signoff .role { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.signoff input[type="text"] { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; min-width: 0; }
.signoff label.checks { font-size: 13px; white-space: nowrap; }

.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { padding: 4px 6px 6px 0; }
.tbl td { padding: 4px 6px 4px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.c { text-align: center; }
.tbl input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
.tbl .k { width: 92px; } .tbl .s { min-width: 220px; } .tbl .ty { width: 84px; } .tbl .pr { width: 66px; } .tbl .pt { width: 62px; }
.tbl .st { width: 118px; } .tbl .as { width: 110px; } .tbl .ar { width: 100px; } .tbl .x { width: 30px; }
.tbl .tm { width: 112px; } .tbl .bb { width: 150px; } .tbl .warn-in { border-color: var(--warn); background: var(--warn-bg); }
.tbl .ph { width: 108px; } .tbl .ow { width: 140px; } .tbl .wh { width: 190px; }
.row-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.msg { font-size: 12px; color: var(--muted); }
.msg.ok { color: var(--good); } .msg.bad { color: var(--bad); }
.icon-btn { border: 1px solid transparent; background: transparent; color: var(--muted); border-radius: 6px; padding: 2px 7px; font-size: 15px; line-height: 1; }
.icon-btn:hover { color: var(--bad); border-color: var(--line); }
.tpl-note { font-size: 12px; color: var(--muted); }

/* results */
.rc { display: flex; flex-direction: column; gap: 16px; }
.risk-head { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.risk-score { font-family: var(--font-data); font-size: 44px; font-weight: 600; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.risk-score small { font-size: 15px; color: var(--muted); font-weight: 400; }
.risk-level { font-weight: 700; font-size: 15px; }
.lvl-Low { color: var(--good); } .lvl-Moderate { color: var(--warn); } .lvl-High, .lvl-Critical { color: var(--bad); }
.meter { position: relative; height: 10px; border-radius: 5px; display: flex; overflow: hidden; margin: 8px 0 2px; }
.meter span { flex: 1; } .meter .m1 { background: var(--good); } .meter .m2 { background: var(--warn); } .meter .m3 { background: var(--bad); opacity: .65; } .meter .m4 { background: var(--bad); }
.meter-wrap { position: relative; flex: 1 1 200px; min-width: 160px; }
.meter-mark { position: absolute; top: 4px; width: 4px; height: 18px; border-radius: 2px; background: var(--ink); transform: translateX(-50%); box-shadow: 0 0 0 2px var(--surface); }
.meter-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); font-family: var(--font-data); }
.factor { display: grid; grid-template-columns: minmax(0, 1fr) 54px; gap: 2px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.factor:last-child { border-bottom: 0; }
.factor .fl { font-weight: 600; }
.factor .fv { font-family: var(--font-data); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.factor .fb { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.factor .fb i { display: block; height: 100%; border-radius: 3px; }
.factor .fd { grid-column: 1 / -1; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.recs { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.ladder { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ladder .step { font-family: var(--font-data); font-size: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; }
.ladder .arrow { color: var(--muted); }
.pts-stack { display: flex; height: 14px; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
.pts-stack span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
.area-row { display: grid; grid-template-columns: 90px 1fr 56px; gap: 8px; align-items: center; font-size: 12px; }
.area-row .fb { height: 8px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.area-row .fb i { display: block; height: 100%; background: var(--good); }
.crow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: start; }
.crow:last-child { border-bottom: 0; }
.crow .cn { font-weight: 600; }
.crow .cd { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.crow .adv { font-family: var(--font-data); font-size: 10px; color: var(--muted); letter-spacing: .05em; margin-left: 6px; }
.crow .wn { grid-column: 2 / -1; font-size: 12px; color: var(--waive); background: var(--waive-bg); border-radius: 6px; padding: 5px 8px; }
.crow .wn.stale { color: var(--bad); background: var(--bad-bg); }
.crow .wf { grid-column: 1 / -1; }
.brief { font-family: var(--font-data); font-size: 12px; line-height: 1.5; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 360px; overflow-y: auto; }
.pill-ok { color: var(--good); } .pill-warn { color: var(--warn); } .pill-bad { color: var(--bad); }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
@media (max-width: 700px) { .sumbar { position: static; } }

/** Fill in the fields a release type normally has. Keeps people, dates and tickets. */
function applyTemplate(plan, type) {
  const tpl = TEMPLATES[type];
  if (!tpl) return plan;
  plan.release.type = type;
  plan.how.strategy = tpl.strategy;
  plan.how.flagsDefaultOff = tpl.flagsDefaultOff;
  plan.how.rollbackMinutes = tpl.rollbackMinutes;
  plan.when.windowHours = tpl.windowHours;
  const prior = new Map(plan.signoffs.map((s) => [s.role, s]));
  const who = { QA: plan.people.qaLead, Product: plan.people.productOwner, Security: plan.people.security, "SRE on-call": plan.people.sre };
  plan.signoffs = tpl.roles.map((role) => prior.get(role) || { role, who: who[role] || "", approved: false });
  plan.runbook = generateRunbook(plan);
  return plan;
}

/** An empty release: only sensible defaults. Dates land on a Tuesday 2 AM deploy at least a week out. */
function blankPlan(now = Date.now(), type = "Minor release") {
  const deployAt = nextWeekday(now, 8, 2, 2);
  const plan = {
    release: { name: "", version: "", type, fixVersion: "", summary: "", customerImpact: "" },
    people: Object.fromEntries(ROLE_KEYS.map(([k]) => [k, ""])),
    extraPeople: [],
    when: { freezeAt: shift(deployAt, -5 * 1440), meetingAt: shift(deployAt, -12 * 60), deployAt, windowHours: 2 },
    where: { repo: "", baseRef: "", headRef: "", environments: ["staging", "prod-us"], services: "" },
    how: { strategy: "canary", flagsDefaultOff: true, rollbackMinutes: 20, channel: "", rollbackPlan: "", dashboards: "", verification: "" },
    scope: { velocity: 0, bigAt: 8, maxFiles: 400, maxLines: 15000 },
    tickets: [],
    signals: {
      ci: { total: 0, realFailures: "", flaky: 0, pending: 0 },
      openPrs: 0, failingOpenPrs: 0, mergedTotal: 0, lateMerged: 0, mergedUnapproved: 0,
      filesChanged: 0, linesChanged: 0, commits: 0, authors: 0,

/**
 * The next release in a series: keeps what rarely changes (people, repository, environments, rollout and
 * rollback settings, budgets, which sign-offs are needed) and clears what belongs to one release
 * (name, dates, tickets, quality signals, checks, approvals, waivers).
 */
function nextPlan(prev, now = Date.now()) {
  const keep = JSON.parse(JSON.stringify(prev));
  const fresh = blankPlan(now, keep.release.type);
  const next = {
    ...fresh,
    people: keep.people,
    extraPeople: keep.extraPeople || [],
    where: { ...keep.where, baseRef: "", headRef: "" },
    how: { ...keep.how },
    scope: keep.scope,
    signals: { ...fresh.signals, coverageFloorPp: keep.signals.coverageFloorPp, p95BudgetPct: keep.signals.p95BudgetPct },
    signoffs: keep.signoffs.map((x) => ({ ...x, approved: false })),
    settings: keep.settings || defaultSettings(),
    customChecks: (keep.customChecks || []).map((c) => ({ ...c, state: "unset" })),
  };
  next.runbook = generateRunbook(next);
  return next;
}

const hasMigration = (plan) => plan.tickets.some((x) => x.tags?.migration) || (plan.checks.migration && plan.checks.migration !== "na");

/** The step-by-step runbook, with owners and times worked out from the plan's dates. */
function generateRunbook(plan) {
  const { when, people, how, where } = plan;
  const D = when.deployAt, F = when.freezeAt, M = when.meetingAt;
  const rows = [];
  let n = 0;
  const row = (phase, step, owner, at) => rows.push({ id: `s${++n}`, phase, step, owner: owner || "", at: at || "", status: "todo" });

  row("Pre-release", "Cut the release branch and freeze scope", people.releaseManager, F);
  row("Pre-release", "Draft release notes", people.comms, shift(D, -3 * 1440));
  if (hasMigration(plan)) row("Pre-release", "Dry-run the migration on production-size data", people.sre, shift(D, -3 * 1440));
  row("Pre-release", "Rehearse the rollback on staging", people.sre, shift(D, -2 * 1440));
  row("Pre-release", "QA regression sign-off", people.qaLead, shift(D, -2 * 1440));
  if (plan.signoffs.some((s) => s.role === "Security")) row("Pre-release", "Security scan and sign-off", people.security, shift(D, -2 * 1440));
  row("Go/no-go", "Go/no-go meeting", people.releaseManager, M);
  row("Deploy", `Announce the deploy window in ${how.channel || "the release channel"}`, people.comms, shift(D, -60));
  if (hasMigration(plan)) row("Deploy", "Run the database migration", people.sre, D);

  const prod = where.environments.filter((e) => e.startsWith("prod"));
  if (how.strategy === "canary") {
    [5, 25, 50, 100].forEach((pct, i) => {
      row("Deploy", `Roll out to ${pct}% of traffic${pct === 100 ? "" : ", watch for 30 minutes"}`, i === 0 ? people.releaseManager : people.sre, shift(D, 10 + i * 40));
    });
  } else if (how.strategy === "phased") {
    (prod.length ? prod : ["production"]).forEach((env, i) => row("Deploy", `Deploy to ${env}${i < prod.length - 1 ? ", watch for 30 minutes" : ""}`, people.sre, shift(D, 10 + i * 45)));
  } else if (how.strategy === "bluegreen") {
    row("Deploy", "Deploy to the idle (green) environment", people.sre, shift(D, 10));
    row("Deploy", "Run smoke tests against green", people.qaLead, shift(D, 30));
    row("Deploy", "Switch traffic to green", people.releaseManager, shift(D, 45));
  } else {
    row("Deploy", "Deploy to all production environments", people.sre, shift(D, 10));
  }

  row("Verify", "Run the verification checklist", people.qaLead, shift(D, 30 + (how.strategy === "canary" ? 120 : 30)));
  row("Verify", "Check error rate and latency dashboards", people.sre, shift(D, 45 + (how.strategy === "canary" ? 120 : 30)));
  row("Verify", "Rollback decision point", people.releaseManager, shift(D, num(how.rollbackMinutes, 20) + 60));
  row("After", "Publish release notes", people.comms, shift(D, 240));
  row("After", `Close the Jira fix version ${plan.release.fixVersion || ""}`.trim(), people.releaseManager, shift(D, 1440));
  row("After", "Schedule the post-release review", people.releaseManager, shift(D, 1440));
  return rows;
}

/** Summary the engine's runbook_ready criterion reads. Only pre-release and go/no-go steps can be overdue. */
function runbookStatus(plan, now) {
  const rows = plan.runbook || [];
  const overdue = rows.filter((r) => ["Pre-release", "Go/no-go"].includes(r.phase) && r.status !== "done" && r.at && parseLocal(r.at) < now).map((r) => r.step);
  return { total: rows.length, done: rows.filter((r) => r.status === "done").length, blocked: rows.filter((r) => r.status === "blocked").map((r) => r.step), overdue };
}

const toIso = (local) => { const ms = parseLocal(local); return ms === null ? undefined : new Date(ms).toISOString(); };

/** Turn the form into the snapshot shape the engine reads, so one engine serves both pages. */
function planToSnapshot(plan, now = Date.now()) {
  const s = plan.signals;
  const freezeMs = parseLocal(plan.when.freezeAt) ?? now;
  const pts = summarizePoints(plan.tickets, num(plan.scope.bigAt, 8));

  const blockers = plan.tickets
    .filter((x) => x.type === "Bug" && x.status !== DONE && ["P0", "P1", "P2"].includes(x.priority))
    .map((x) => ({ key: x.key, sev: x.priority, title: x.summary, owner: x.assignee || "Unassigned", ageDays: 0, status: x.status, source: "jira" }));

  const real = String(s.ci.realFailures || "").split("\n").map((x) => x.trim()).filter(Boolean);
  const flaky = Array.from({ length: Math.max(0, num(s.ci.flaky)) }, (_, i) => `flaky check ${i + 1} (quarantine)`);
  const pending = Array.from({ length: Math.max(0, num(s.ci.pending)) }, (_, i) => `pending check ${i + 1}`);
  const total = Math.max(num(s.ci.total), real.length + flaky.length + pending.length);

  const mergedTotal = Math.max(0, num(s.mergedTotal));
  const late = Math.min(mergedTotal, Math.max(0, num(s.lateMerged)));
  const unapproved = Math.min(mergedTotal, Math.max(0, num(s.mergedUnapproved)));
  const mergedPrs = Array.from({ length: mergedTotal }, (_, i) => ({
    number: i + 1,
    mergedAt: new Date(i < late ? freezeMs + (i + 1) * 3600000 : freezeMs - (i + 1) * 3600000).toISOString(),
    approved: i >= unapproved,
  }));

  const openPrs = Array.from({ length: Math.max(0, num(s.openPrs)) }, (_, i) => ({
    number: i + 1, checks: i < num(s.failingOpenPrs) ? "failing" : "passing",
  }));

  return {
    release: { name: plan.release.name || "Untitled release", repo: plan.where.repo, freezeDate: toIso(plan.when.freezeAt) },
    sources: { github: "ok", jira: "ok" },
    errors: {},
    data: {
      blockers,
      ci: { total, passed: Math.max(0, total - real.length - flaky.length - pending.length), failed: [...real, ...flaky], pending },
      openPrs, mergedPrs,
      compare: { commits: num(s.commits), filesChanged: num(s.filesChanged), truncated: false, additions: num(s.linesChanged), deletions: 0, authors: num(s.authors) },
      draftRelease: { exists: plan.checks.notes === "pass" },
      signoffs: plan.signoffs.map((x) => ({ role: x.role, approved: Boolean(x.approved) })),
      points: { total: pts.total, done: pts.done, remaining: pts.remaining, bigOpen: pts.bigOpen },
      security: { critical: num(s.securityCritical), high: num(s.securityHigh) },
      p95DeltaPct: num(s.p95DeltaPct), coverageDeltaPp: num(s.coverageDeltaPp),
      runbook: runbookStatus(plan, now),
      deps: analyzeDependencies(plan.tickets, plan.handoffs, now, freezeMs),
    },
  };
}

/** Manual checks and waivers in the shape the engine's state argument uses. */
function planState(plan) {
  const notes = { na: "Not applicable to this release." };
  const manual = {};
  for (const id of ["migration", "rollback", "errorbudget"]) {
    const v = plan.checks[id];
    if (!v || v === "unset") continue;
    manual[id] = { state: v === "na" ? "pass" : v, by: plan.people.releaseManager, note: notes[v] || "" };
  }
  for (const c of plan.customChecks || []) {
    if (!c.state || c.state === "unset") continue;
    manual[`custom-${c.id}`] = { state: c.state === "na" ? "pass" : c.state, by: plan.people.releaseManager, note: c.state === "na" ? notes.na : "" };
  }
  return { manual, waivers: plan.waivers || {} };
}

/** Which criteria apply, and how strict they are. */
function planConfig(plan) {
  const sig = plan.signals;
  const overrides = plan.settings?.criteria || {};
  const builtIn = [
      { id: "p0", name: "No open P0 defects", type: "blockers_none", params: { severity: "P0" } },
      { id: "p1", name: "No open P1 defects", type: "blockers_none", params: { severity: "P1", failAs: "warn" } },
      { id: "points", name: "Story points complete", type: "points_complete", params: { minDonePct: 100, failBelowPct: 70 } },
      { id: "big", name: "No large ticket left open", type: "large_open", required: false },
      { id: "deps", name: "Dependencies clear", type: "dependencies_clear", required: false, params: { waitingAs: "warn" } },
      { id: "ci", name: "Release branch checks green", type: "ci_green" },
      { id: "migration", name: "Migration dry run on production-size data", type: "manual", source: "manual", params: { checkId: "migration" } },
      { id: "prs", name: "All scoped PRs merged", type: "open_prs", params: { failAs: "warn" } },
      { id: "signoffs", name: "Sign-offs collected", type: "signoffs" },
      { id: "rollback", name: "Rollback rehearsed", type: "manual", source: "manual", params: { checkId: "rollback" } },
      { id: "security", name: "No critical or high vulnerabilities", type: "security_clear" },
      { id: "perf", name: "p95 latency within budget", type: "metric_budget", params: { key: "p95DeltaPct", max: num(sig.p95BudgetPct, 5), unit: "%", signed: true, label: "p95 latency" } },
      { id: "coverage", name: "Coverage within budget", type: "metric_budget", required: false, params: { key: "coverageDeltaPp", min: num(sig.coverageFloorPp, -1), unit: " pp", label: "coverage" } },
      { id: "reviews", name: "Every merged PR had an approval", type: "review_coverage", required: false, params: { max: 0, failAs: "warn" } },
      { id: "late", name: "Nothing merged after the freeze", type: "late_changes", required: false, params: { max: 0 } },
      { id: "size", name: "Release size within budget", type: "change_size", required: false, params: { maxFiles: num(plan.scope.maxFiles, 400), maxLines: num(plan.scope.maxLines, 15000) } },
      { id: "notes", name: "Release notes drafted", type: "draft_release", required: false },
      { id: "errorbudget", name: "Error budget above floor", type: "manual", source: "manual", required: false, params: { checkId: "errorbudget" } },
      { id: "runbook", name: "Pre-release steps on schedule", type: "runbook_ready", required: false },
  ];
  const chosen = builtIn
    .filter((c) => overrides[c.id]?.on !== false)
    .map((c) => (overrides[c.id]?.required === undefined ? c : { ...c, required: overrides[c.id].required }));
  const custom = (plan.customChecks || []).map((c) => ({
    id: `custom-${c.id}`, name: c.name || "Untitled check", type: "manual", source: "manual", required: c.required !== false, params: { checkId: `custom-${c.id}` },
  }));
  return { ci: { quarantine: ["quarantine"] }, criteria: [...chosen, ...custom] };
}

/** The built-in criteria, for the settings screen to list. */
const criteriaCatalog = () => planConfig(blankPlan(0)).criteria.map((c) => ({ id: c.id, name: c.name, required: c.required !== false }));

const fmtWhen = (local) => { const ms = parseLocal(local); return ms === null ? "not set" : new Date(ms).toLocaleString("en-US", { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); };
const joinList = (a) => (a.length <= 1 ? a.join("") : `${a.slice(0, -1).join(", ")} and ${a.at(-1)}`);

/**
 * The report as data: sections made of paragraphs, lists, tables and checklists.
 * Markdown and HTML are both rendered from this, so they always say the same thing.
 */
function reportModel(plan, result, risk, now = Date.now()) {
  const P = plan, { verdict, criteria } = result, pts = risk.points, fc = risk.forecast;
  const name = P.release.name || "Untitled release";
  const required = criteria.filter((c) => c.required);
  const clear = required.filter((c) => c.effective === "pass" || c.effective === "waived").length;
  const drivers = [...risk.factors].filter((f) => f.points > 0).sort((a, b) => b.points - a.points).slice(0, 3).map((f) => f.label.toLowerCase());
  const holding = criteria.filter((c) => verdict.holding.includes(c.id));
  const order = { fail: 0, warn: 1, pending: 2, waived: 3, pass: 4 };
  const sections = [];
  const sec = (title, ...blocks) => sections.push({ title, blocks });
  const ul = (items) => ({ t: "ul", items });
  const p = (text) => ({ t: "p", text });
  const table = (head, rows) => ({ t: "table", head, rows });

  sec("Summary",
    p(`${name} is ${verdict.call}. ${verdict.reason} Risk is ${risk.score} out of 100 (${risk.level})${drivers.length ? `, driven mostly by ${joinList(drivers)}` : ""}. ` +
      `${pts.total ? `${pts.done} of ${pts.total} story points are done (${pts.pctDone}%). ${fc.detail}` : "No story points have been entered."} ${clear} of ${required.length} required criteria are clear.`),
    ...(holding.length ? [{ t: "h3", text: "What is holding the release" }, ul(holding.map((c) => `${c.name} (${c.effective}): ${c.detail}`))] : []));

  sec("What", ul([
    `Release: ${name}${P.release.version ? ` (${P.release.version})` : ""}, ${P.release.type}`,
    `Jira fix version: ${P.release.fixVersion || "not set"}`,
    `Changes: ${P.release.summary || "not set"}`,
    `Customer impact: ${P.release.customerImpact || "not set"}`,
  ]));

  sec("Who", ul([
    ...ROLE_KEYS.map(([k, label]) => `${label}: ${P.people[k] || "not set"}`),
    ...(P.extraPeople || []).map((x) => `${x.label}: ${x.name || "not set"}`),
    ...((P.signoffs || []).length ? [`Sign-offs: ${P.signoffs.map((s) => `${s.role} (${s.who || "unassigned"}, ${s.approved ? "approved" : "pending"})`).join("; ")}`] : []),
  ]));

  sec("When", ul([
    `Code freeze: ${fmtWhen(P.when.freezeAt)}`,
    `Go/no-go meeting: ${fmtWhen(P.when.meetingAt)}`,
    `Deploy: ${fmtWhen(P.when.deployAt)} for ${P.when.windowHours} hours`,
  ]));

  sec("Where", ul([
    `Repository: ${P.where.repo || "not set"}${P.where.headRef ? `, ${P.where.headRef} compared with ${P.where.baseRef || "not set"}` : ""}`,
    `Environments: ${P.where.environments.join(", ") || "none selected"}`,
    `Services: ${P.where.services || "not set"}`,
  ]));

  sec("How", ul([
    `Rollout: ${risk.ladder.steps.join("% → ")}%, ${risk.ladder.bake} minute bake. ${risk.ladder.note}`,
    `Feature flags default off: ${P.how.flagsDefaultOff ? "yes" : "no"}`,
    `Rollback (${P.how.rollbackMinutes} minutes): ${P.how.rollbackPlan || "not written"}`,
    `Communication: ${P.how.channel || "not set"}. Dashboards: ${P.how.dashboards || "not set"}`,
    `Verification: ${P.how.verification || "not set"}`,
  ]));

  sec("Scope and story points",
    p(pts.total ? `${pts.done} of ${pts.total} points done (${pts.pctDone}%). ${pts.inFlight} in flight, ${pts.todo} not started. ${fc.detail}` : "No story points have been entered."),
    table(["Status", "Points"], STATUSES.map((st) => [st, String(pts.byStatus[st])])),
    ...(Object.keys(pts.byArea).length ? [table(["Area", "Done", "Total"], Object.entries(pts.byArea).sort((a, b) => b[1].total - a[1].total).map(([a, v]) => [a, String(v.done), String(v.total)]))] : []));

  const dep = analyzeDependencies(P.tickets, P.handoffs, now, parseLocal(P.when.freezeAt));

/* ---------- input rendering ---------- */

const fid = (p) => "f-" + p.replace(/\./g, "-");

function selectHtml(p, options, value, extra = "") {
  const o = options.map((x) => (typeof x === "string" ? { v: x, l: x } : x));
  return `<select data-p="${p}" ${extra}>${o.map((x) => `<option value="${esc(x.v)}"${x.v === value ? " selected" : ""}>${esc(x.l)}</option>`).join("")}</select>`;
}

function fieldHtml(f) {
  const v = getPath(P, f.p);
  const id = fid(f.p);
  const cls = `field${f.wide ? " wide" : ""}`;
  const mono = f.mono ? " mono" : "";
  if (f.t === "check") {
    return `<div class="${cls}"><span class="lab">${esc(f.l)}</span><div class="checks"><label><input type="checkbox" id="${id}" data-p="${f.p}"${v ? " checked" : ""}> ${v ? "Yes" : "No"}</label></div></div>`;
  }
  if (f.t === "multi") {
    return `<div class="${cls}"><span class="lab">${esc(f.l)}</span><div class="checks">${f.o.map((o) => `<label><input type="checkbox" data-p="${f.p}" data-multi="1" value="${esc(o.v)}"${(v || []).includes(o.v) ? " checked" : ""}> ${esc(o.l)}</label>`).join("")}</div></div>`;
  }
  let control;
  if (f.t === "select") control = selectHtml(f.p, f.o, v, `id="${id}"`);
  else if (f.t === "textarea") control = `<textarea id="${id}" data-p="${f.p}" rows="3">${esc(v)}</textarea>`;
  else if (f.t === "number") control = `<input id="${id}" type="number" step="any" data-p="${f.p}" value="${esc(v)}">`;
  else if (f.t === "datetime") control = `<input id="${id}" type="datetime-local" data-p="${f.p}" value="${esc(v)}">`;
  else control = `<input id="${id}" class="${mono.trim()}" type="text" data-p="${f.p}" value="${esc(v)}" placeholder="${esc(f.ph || "")}" autocomplete="off">`;
  const after = f.after === "tpl"
    ? `<div class="row-actions"><button class="btn small" type="button" data-act="apply-template">Apply defaults for this type</button><span class="tpl-note">Sets rollout, window, rollback time, sign-off roles and the runbook.</span></div>`
    : f.suffix ? `<span class="suffix">${esc(f.suffix)}</span>` : "";
  return `<div class="${cls}"><label for="${id}">${esc(f.l)}</label>${control}${after}</div>`;
}

/** A note when a "blocked by" names a ticket that is not in this release. */
function blockedUnknown(t) {
  const known = new Set(P.tickets.map((x) => String(x.key).toUpperCase()));
  const bad = parseKeys(t.blockedBy).filter((k) => !known.has(k) && k !== String(t.key).toUpperCase());
  return bad.length ? `${bad.join(", ")} ${bad.length === 1 ? "is" : "are"} not in this release's ticket list, so ${bad.length === 1 ? "it counts" : "they count"} as unresolved.` : "";
}

/* ---------- library actions ---------- */

function relLabel(p, now) {
  let tail = "";
  try {
    const r = evaluate(planToSnapshot(p, now), planConfig(p), planState(p));
    tail = ` · ${r.verdict.call} · risk ${computeRisk(p, now).score}`;
  } catch { /* a broken plan still gets a name */ }
  return (p.release.name || "Untitled release") + tail;
}

function renderRelSelect() {
  const now = Date.now(), sel = $("#rel-select");
  if (!sel) return;
  sel.innerHTML = lib.order.map((id) => `<option value="${esc(id)}"${id === lib.current ? " selected" : ""}>${esc(relLabel(id === lib.current ? P : lib.items[id], now))}</option>`).join("");
}

function showRelease() {
  openWaive = null; waiveError = "";
  if (remote) store.set("rr.current", lib.current);
  saveLib();
  renderInputs();
  renderResults();
}

function openRelease(id) {
  if (!lib.items[id]) return;
  lib.items[lib.current] = P;
  lib.current = id;
  P = lib.items[id];
  showRelease();
}

function addRelease(plan) {
  plan.id = newId();
  lib.items[lib.current] = P;
  lib.items[plan.id] = plan;
  lib.order.push(plan.id);
  lib.current = plan.id;
  P = plan;
  showRelease();
}

let lastDeleted = null;
function deleteRelease() {
  const id = lib.current, idx = lib.order.indexOf(id), name = P.release.name || "Untitled release";
  lastDeleted = { plan: P, idx };
  lib.order.splice(idx, 1);
  delete lib.items[id];
  if (remote) removeRemote(id);
  if (!lib.order.length) { const b = { ...blankPlan(Date.now(), P.release.type), id: newId() }; lib.items[b.id] = b; lib.order.push(b.id); }
  lib.current = lib.order[Math.min(idx, lib.order.length - 1)];
  P = lib.items[lib.current];
  showRelease();
  sayRel(`Deleted “${name}”.`, true);
}

function sayRel(text, undo = false, kind = "") {
  const el = $("#rel-msg");
  el.className = "msg " + kind;
  el.innerHTML = esc(text) + (undo ? ` <button class="btn small" type="button" data-act="rel-undo">Undo</button>` : "");
}

/* ---------- results ---------- */

function compute() {
  const now = Date.now();
  const snapshot = planToSnapshot(P, now);
  const result = evaluate(snapshot, planConfig(P), planState(P));
  const risk = computeRisk(P, now);
  const deps = analyzeDependencies(P.tickets, P.handoffs, now, Date.parse(P.when.freezeAt) || null);
  return { now, result, risk, deps, brief: briefMarkdown(P, result, risk, now) };
}

const ratioColor = (r) => (r >= 0.66 ? "var(--bad)" : r >= 0.33 ? "var(--warn)" : "var(--good)");
const FC_CHIP = { complete: "pass", "on-track": "pass", tight: "warn", behind: "fail", "after-freeze": "fail", unknown: "pending" };
const FC_TEXT = { complete: "Complete", "on-track": "On track", tight: "Tight", behind: "Behind", "after-freeze": "Open after freeze", unknown: "No velocity" };

function renderSumbar({ result, risk, now }) {
  const v = result.verdict, cls = { "NO-GO": "nogo", HOLD: "hold", GO: "go" }[v.call];
  const deploy = Date.parse(P.when.deployAt);
  const days = Number.isNaN(deploy) ? "not set" : deploy < now ? "passed" : `${Math.max(0, Math.round(((deploy - now) / 86400000) * 10) / 10)} d`;
  const kv = (b, s, c = "") => `<div class="kv"><b class="${c}">${esc(b)}</b><span>${esc(s)}</span></div>`;
  $("#sumbar").innerHTML =
    `<span class="call ${cls}">${esc(v.call)}</span>` +
    kv(`${risk.score}/100`, `Risk · ${risk.level}`, `lvl-${risk.level}`) +
    kv(`${risk.points.pctDone}%`, `Points done · ${risk.points.done}/${risk.points.total}`) +
    kv(days, "To deploy") +
    kv(`${v.counts.fail + v.counts.warn + v.counts.pending}`, "Criteria open") +
    `<span class="spacer"></span><div class="toolbar">${STANDALONE ? `<button class="btn small" type="button" data-act="copy-json">Copy plan JSON</button>` : `<button class="btn small" type="button" data-act="export">Export plan</button>`}</div>`;
}

function renderVerdict({ result }) {
  const { verdict, criteria } = result;
  const cls = { "NO-GO": "nogo", HOLD: "hold", GO: "go" }[verdict.call];
  const total = criteria.length || 1;
  const bar = ["pass", "waived", "warn", "pending", "fail"].map((k) => `<span class="p-${k}" style="width:${(verdict.counts[k] / total) * 100}%" title="${LABEL[k]}: ${verdict.counts[k]}"></span>`).join("");
  const tally = ["pass", "warn", "pending", "fail", "waived"].filter((k) => verdict.counts[k]).map((k) => `<span class="chip s-${k}"><i></i>${verdict.counts[k]} ${LABEL[k].toLowerCase()}</span>`).join("");
  const holding = criteria.filter((c) => verdict.holding.includes(c.id));
  const list = holding.length
    ? `<div class="holding"><h3>What is holding the release</h3><ul>${holding.map((c) => `<li>${chip(c.effective)}<span><strong>${esc(c.name)}</strong> <span class="mono">${esc(c.detail)}</span></span></li>`).join("")}</ul></div>`
    : `<div class="holding"><h3>Nothing is holding the release</h3></div>`;
  return `<section class="verdict" aria-label="Go/no-go verdict"><div class="v-badge ${cls}"><span class="label">Current call</span><span class="word">${esc(verdict.call)}</span><span>${esc(verdict.reason)}</span></div><div class="v-body"><div class="tally">${tally}</div><div class="progress" role="img" aria-label="Criteria mix">${bar}</div>${list}</div></section>`;
}

function renderRisk({ risk }) {
  const sorted = [...risk.factors].sort((a, b) => b.points - a.points);
  const active = sorted.filter((f) => f.points > 0), quiet = sorted.filter((f) => f.points === 0);
  const rows = active.map((f) => {
    const r = f.points / f.max;
    return `<div class="factor"><span class="fl">${esc(f.label)}</span><span class="fv">${f.points} / ${f.max}</span><div class="fb"><i style="width:${r * 100}%;background:${ratioColor(r)}"></i></div><span class="fd">${esc(f.detail)}</span></div>`;
  }).join("");
  const recs = risk.recommendations.length
    ? `<div class="sec-head"><h2>What to do about it</h2></div><ol class="recs">${risk.recommendations.map((r) => `<li><strong>${esc(r.label)}.</strong> ${esc(r.advice)}</li>`).join("")}</ol>`
    : `<div class="msg">No single factor is driving the risk.</div>`;
  const ladder = `<div class="sec-head"><h2>Suggested rollout for this risk level</h2></div><div class="ladder">${risk.ladder.steps.map((p, i) => `${i ? '<span class="arrow">→</span>' : ""}<span class="step">${p}%</span>`).join("")}<span class="msg">${risk.ladder.bake} minute bake</span></div><div class="msg">${esc(risk.ladder.note)}</div>`;
  return `<section class="panel"><h2>Risk analysis</h2>
    <div class="risk-head"><div><div class="risk-score">${risk.score}<small> / 100</small></div><div class="risk-level lvl-${risk.level}">${risk.level} risk</div></div>
    <div class="meter-wrap"><div class="meter"><span class="m1"></span><span class="m2"></span><span class="m3"></span><span class="m4"></span></div><div class="meter-mark" style="left:${risk.score}%"></div><div class="meter-labels"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div></div></div>
    <div>${rows}</div>${quiet.length ? `<div class="msg">No risk from: ${quiet.map((f) => esc(f.label.toLowerCase())).join(", ")}.</div>` : ""}
    ${recs}${ladder}</section>`;
}

function renderPoints({ risk }) {
  const p = risk.points, fc = risk.forecast, t = p.total || 1;
  const areas = Object.entries(p.byArea).sort((a, b) => b[1].total - a[1].total);
  return `<section class="panel"><div class="panel-head"><h2>Story points</h2><span class="chip s-${FC_CHIP[fc.state]}"><i></i>${FC_TEXT[fc.state]}</span></div>
    <div class="pts-stack" role="img" aria-label="${p.done} done, ${p.inFlight} in flight, ${p.todo} not started"><span style="width:${(p.done / t) * 100}%;background:var(--good)"></span><span style="width:${(p.inFlight / t) * 100}%;background:var(--pend)"></span><span style="width:${(p.todo / t) * 100}%;background:var(--line)"></span></div>
    <div class="legend"><span><i style="background:var(--good)"></i>Done ${p.done}</span><span><i style="background:var(--pend)"></i>In flight ${p.inFlight}</span><span><i style="background:var(--line)"></i>Not started ${p.todo}</span></div>
    <div class="stats"><div class="stat"><b>${p.total}</b><span>Total points</span></div><div class="stat"><b>${p.remaining}</b><span>Remaining</span></div><div class="stat"><b>${fc.needPerDay ?? "n/a"}</b><span>Needed per day</span></div><div class="stat"><b>${fc.velocity || "n/a"}</b><span>Velocity per day</span></div></div>
    <div class="msg">${esc(fc.detail)}</div>
    <div>${areas.map(([a, v]) => `<div class="area-row"><span>${esc(a)}</span><div class="fb"><i style="width:${v.total ? (v.done / v.total) * 100 : 0}%"></i></div><span class="mono">${v.done}/${v.total}</span></div>`).join("")}</div></section>`;
}

function renderDeps({ result, deps }) {
  const c = result.criteria.find((x) => x.id === "deps");
  const head = `<div class="panel-head"><h2>Dependencies</h2>${c ? chip(c.effective) : ""}</div>`;
  if (!deps.any) return `<section class="panel">${head}<div class="msg">Nothing entered yet. Use <strong>Team</strong> and <strong>Blocked by</strong> on the tickets, and <strong>Handoffs between teams</strong> below them, to show what waits on what. Pulling from Jira fills in "is blocked by" links for you.</div></section>`;
  const on = (w) => w.on.map((x) => (x.kind === "handoff" ? `${esc(x.what)} <span class="msg">(${esc(x.team || "handoff")}, ${esc(x.status)})</span>` : `<span class="mono">${esc(x.key)}</span> <span class="msg">(${esc(x.status)})</span>`)).join(", ");
  const h3 = (t) => `<div class="sec-head"><h2>${esc(t)}</h2></div>`;
  let html = head + (c ? `<div class="msg">${esc(c.detail)}</div>` : "");
  if (deps.cycles.length) html += `<div class="banner bad" role="alert"><strong>Circular dependency.</strong><span>${deps.cycles.map((x) => esc([...x, x[0]].join(" → "))).join("; ")}. None of these can start until one of the links is removed.</span></div>`;
  if (deps.longestChain.length >= 2) html += h3("Longest chain, in the order it must happen") + `<div class="ladder">${deps.longestChain.keys.map((k, i) => `${i ? '<span class="arrow">→</span>' : ""}<span class="step mono">${esc(k)}</span>`).join("")}</div>`;
  if (deps.finishFirst.length) html += h3("Finish these first") + `<ul class="plain">${deps.finishFirst.map((x) => `<li><span class="mono">${esc(x.key)}</span>${x.team ? ` <span class="msg">${esc(x.team)}</span>` : ""} ${esc(x.summary)}: holds up ${x.unblocks} ${x.unblocks === 1 ? "ticket" : "tickets"}</li>`).join("")}</ul>`;
  if (deps.waiting.length) html += h3("Waiting") + `<div class="tablewrap"><table class="tbl"><thead><tr><th>Ticket</th><th>Team</th><th>Status</th><th>Waiting on</th></tr></thead><tbody>${deps.waiting.map((w) => `<tr><td><span class="mono">${esc(w.key)}</span> ${esc(w.summary)}</td><td>${esc(w.team || "—")}</td><td>${esc(w.status)}</td><td>${on(w)}</td></tr>`).join("")}</tbody></table></div>`;
  if (deps.startedEarly.length) html += h3("Started before the input was done") + `<ul class="plain">${deps.startedEarly.map((w) => `<li><span class="mono">${esc(w.key)}</span> is ${esc(w.status.toLowerCase())} but waiting on ${on(w)}</li>`).join("")}</ul>`;
  if (deps.ready.length) html += h3("Ready to start now") + `<ul class="plain">${deps.ready.map((x) => `<li><span class="mono">${esc(x.key)}</span> ${esc(x.summary)}</li>`).join("")}</ul>`;
  const lateH = [...deps.handoffs.overdue.map((x) => `${esc(x.what)} (${esc(x.from || "?")} to ${esc(x.to || "?")}) is overdue`), ...deps.handoffs.blocked.map((x) => `${esc(x.what)} is blocked`), ...deps.handoffs.afterFreeze.map((x) => `${esc(x.what)} is due after the code freeze`)];
  if (lateH.length) html += h3("Handoffs to chase") + `<ul class="plain">${lateH.map((x) => `<li>${x}</li>`).join("")}</ul>`;
  return `<section class="panel">${html}</section>`;
}

function renderCriteria({ result }) {
  const order = { fail: 0, warn: 1, pending: 2, waived: 3, pass: 4 };
  const sorted = [...result.criteria].sort((a, b) => order[a.effective] - order[b.effective]);
  const rows = sorted.map((c) => {
    const w = c.waiver, active = w && w.valid && !w.stale;
    const wn = w && c.effective === "waived" ? `<div class="wn">Waived by ${esc(w.approver)}: ${esc(w.reason)}</div>`
      : w && w.stale ? `<div class="wn stale">A waiver from ${esc(w.approver)} no longer applies because this got worse.</div>` : "";
    const btns = [
      c.status !== "pass" && !active ? `<button class="btn small" type="button" data-act="waive" data-id="${esc(c.id)}">Waive</button>` : "",
      w ? `<button class="btn small" type="button" data-act="unwaive" data-id="${esc(c.id)}">Remove waiver</button>` : "",
    ].join("");
    const form = openWaive === c.id
      ? `<form class="form wf" data-form="waive" data-id="${esc(c.id)}"><label>Approved by<input name="approver" required maxlength="80" value="${esc(P.people.releaseManager)}"></label><label>Reason<textarea name="reason" required maxlength="400" placeholder="Why this is acceptable, and what follows (a hotfix, a monitor)"></textarea></label>${waiveError ? `<div class="err" role="alert">${esc(waiveError)}</div>` : ""}<div class="row"><button class="btn small primary" type="submit">Record waiver</button><button class="btn small" type="button" data-act="close-waive">Cancel</button></div></form>` : "";
    return `<div class="crow">${chip(c.effective)}<div><span class="cn">${esc(c.name)}</span><span class="adv">${c.required ? "REQUIRED" : "ADVISORY"}</span><div class="cd">${esc(c.detail)}</div></div><div class="row-actions">${btns}</div>${wn}${form}</div>`;
  }).join("");
  return `<section class="panel"><div class="panel-head"><h2>Go/no-go criteria</h2><span class="note">A waiver needs a named approver and a reason.</span></div><div>${rows}</div></section>`;
}

function renderBrief({ brief }) {
  return `<section class="panel"><div class="panel-head"><h2>Release brief</h2><div class="row-actions"><button class="btn small" type="button" data-act="copy-brief">Copy Markdown</button>${STANDALONE ? "" : `<button class="btn small" type="button" data-act="download-brief">Download .md</button>`}<span class="msg" id="brief-msg"></span></div></div><pre class="brief" id="brief">${esc(brief)}</pre></section>`;
}

let last = null;
function renderResults() {
  try {
    last = compute();
  } catch (e) {
    $("#results").innerHTML = `<div class="banner bad"><strong>Could not compute the results.</strong><span>${esc(e.message)}</span></div>`;
    return;
  }
  renderSumbar(last);
  const fresh = !P.release.name.trim() && P.tickets.length === 0 && !Number(P.signals.ci.total);
  const roNote = READONLY ? `<div class="banner"><strong>View only.</strong><span>This is an example release with invented names and numbers. You can look at everything, but nothing can be changed or saved.</span></div>` : "";
  const note = roNote + (fresh ? `<div class="banner"><strong>New release.</strong><span>Name it and set the dates on the left, then add tickets or pull them from Jira. The call stays HOLD until the checks have data, and anything unknown counts as risk.</span></div>` : "");
  renderRelSelect();
  $("#results").innerHTML = note + renderVerdict(last) + renderRisk(last) + renderPoints(last) + renderDeps(last) + renderCriteria(last) + renderBrief(last);
  const p = last.risk.points;
  const sum = $("#tk-sum");
  if (sum) sum.textContent = `${p.tickets} tickets · ${p.total} points · ${p.done} done`;
}

let raf = 0, saveTimer = 0;
function changed() {
  lastEdit = Date.now();
  if (readOnly()) setSaveState("View only: changes are not saved.", "bad");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveLib, 250);
  renderClear();

}

function onEdit(e) {
  const el = e.target.closest("[data-p]");
  if (!el) return;
  if (el.dataset.multi) {
    setPath(P, el.dataset.p, [...document.querySelectorAll(`[data-multi][data-p="${el.dataset.p}"]:checked`)].map((x) => x.value));
  } else if (el.type === "radio") {
    if (el.checked) setPath(P, el.dataset.p, el.value === "true");
  } else if (el.type === "checkbox") {
    setPath(P, el.dataset.p, el.checked);
    const lab = el.closest("label");
    if (lab && el.dataset.p === "how.flagsDefaultOff") lab.lastChild.textContent = el.checked ? " Yes" : " No";
  } else if (el.type === "number") {
    setPath(P, el.dataset.p, el.value === "" ? 0 : Number(el.value));
  } else {
    setPath(P, el.dataset.p, el.value);
  }
  if (/^(people|extraPeople)\./.test(el.dataset.p)) renderPeopleList();
  changed();
}
document.addEventListener("input", onEdit);
document.addEventListener("change", onEdit);

const blankTicket = () => ({ key: "REL-", summary: "", type: "Story", priority: "P2", points: 0, status: "To do", assignee: "", area: "Core", team: "", blockedBy: "", tags: { migration: false, customerFacing: false, untested: false } });

const slug = () => (P.release.name || "release").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

function updateJiraButton() {

async function refreshJira() {
  const version = P.release.fixVersion.trim();
  if (!version) { say("jira-msg", "Enter the Jira fix version first.", "bad"); return; }
  say("jira-msg", "Refreshing from Jira…");
  try {
    const res = await fetch("/api/jira/issues?version=" + encodeURIComponent(version));
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || `Request failed (${res.status}).`);
    const byKey = new Map(body.issues.map((i) => [i.key, i]));
    let updated = 0;
    P.tickets = P.tickets.map((t) => {
      const r = byKey.get(t.key);
      if (!r) return t;
      byKey.delete(t.key);
      updated++;
      return { ...t, ...r, team: t.team || r.team || "", blockedBy: r.blockedBy || t.blockedBy || "", tags: { ...(r.tags || {}), ...(t.tags || {}) } };
    });
    const added = [...byKey.values()];
    P.tickets.push(...added);
    renderTickets(); changed();
    say("jira-msg", `Refreshed ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}: ${updated} updated, ${added.length} new, ${P.tickets.length - updated - added.length} not in Jira kept as they were.`, "ok");
  } catch (e) {
    say("jira-msg", e.message, "bad");
  }
}

async function pullJira() {
  const version = P.release.fixVersion.trim();
  if (!version) { say("jira-msg", "Enter the Jira fix version first.", "bad"); return; }
  say("jira-msg", "Loading from Jira…");
  try {
    const res = await fetch("/api/jira/issues?version=" + encodeURIComponent(version));
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || `Request failed (${res.status}).`);
    P.tickets = body.issues;
    renderTickets(); changed();
    const pts = body.issues.reduce((n, i) => n + i.points, 0);
    say("jira-msg", `Loaded ${body.issues.length} tickets and ${pts} points from fix version ${version}. This replaced the tickets above.`, "ok");
  } catch (e) {
    say("jira-msg", e.message, "bad");
  }
}

document.addEventListener("click", async (e) => {
  const a = e.target.closest("[data-act]");
  if (!a) return;
  const act = a.dataset.act, i = Number(a.dataset.i);
  if (act === "add-ticket") {
    P.tickets.push(blankTicket()); renderTickets(); changed();
    const rows = document.querySelectorAll("#tickets-body tr"); rows[rows.length - 1]?.querySelector("input")?.focus();
  } else if (act === "del-ticket") { P.tickets.splice(i, 1); renderTickets(); changed(); }
  else if (act === "add-handoff") {
    (P.handoffs ||= []).push({ what: "", from: "Design", to: "Frontend", owner: "", due: P.when.freezeAt || "", status: "Not started", blocks: "" });
    renderHandoffs(); changed();
    const rows = document.querySelectorAll("#handoffs-body tr"); rows[rows.length - 1]?.querySelector("input")?.focus();
  }
  else if (act === "del-handoff") { P.handoffs.splice(i, 1); renderHandoffs(); changed(); }
  else if (act === "add-step") { P.runbook.push({ id: "s" + Date.now(), phase: "Deploy", step: "", owner: P.people.releaseManager, at: P.when.deployAt, status: "todo" }); renderRunbook(); changed(); }
  else if (act === "del-step") { P.runbook.splice(i, 1); renderRunbook(); changed(); }
  else if (act === "regen-runbook") { P.runbook = generateRunbook(P); renderRunbook(); changed(); say("rb-msg", "Runbook regenerated from the plan.", "ok"); }
  else if (act === "apply-template") {
    applyTemplate(P, P.release.type); renderInputs(); changed();
    const t = TEMPLATES[P.release.type];
    say("rb-msg", `Applied ${P.release.type} defaults: ${t.strategy} rollout, ${t.windowHours} hour window, ${t.rollbackMinutes} minute rollback, sign-offs from ${t.roles.join(", ")}.`, "ok");
  }
  else if (act === "add-person" || act === "add-signoff") {
    const kind = act === "add-person" ? "person" : "signoff";
    addOpen = addOpen === kind ? null : kind;
    renderExtraPeople(); renderSignoffs();
    $(`#${kind}-add input`)?.focus();
  }
  else if (act === "cancel-add") { addOpen = null; renderExtraPeople(); renderSignoffs(); }
  else if (act === "del-person") { P.extraPeople.splice(i, 1); renderExtraPeople(); renderPeopleList(); changed(); }
  else if (act === "del-signoff") { P.signoffs.splice(i, 1); renderSignoffs(); changed(); }
  else if (act === "clear") {
    const what = a.dataset.what, n = P[what].length;
    lastCleared[what] = P[what]; P[what] = [];
    if (what === "tickets") renderTickets(); else renderRunbook();
    changed();
    sayUndo(what === "tickets" ? "jira-msg" : "rb-msg", `Cleared ${n} ${what === "tickets" ? "tickets" : "steps"}.`, what);
  }
  else if (act === "undo-clear") {
    const what = a.dataset.what;
    if (lastCleared[what]) {
      P[what] = lastCleared[what]; delete lastCleared[what];
      if (what === "tickets") renderTickets(); else renderRunbook();
      changed();
      say(what === "tickets" ? "jira-msg" : "rb-msg", "Restored.", "ok");
    }
  }
  else if (act === "pull-jira") pullJira();
  else if (act === "refresh-jira") refreshJira();
  else if (act === "waive") { openWaive = a.dataset.id; waiveError = ""; renderResults(); }
  else if (act === "close-waive") { openWaive = null; waiveError = ""; renderResults(); }
  else if (act === "unwaive") { delete P.waivers[a.dataset.id]; changed(); }
  else if (act === "copy-brief") {
    const text = last.brief;
    try { await navigator.clipboard.writeText(text); say("brief-msg", "Copied.", "ok"); }
    catch { const r = document.createRange(); r.selectNodeContents($("#brief")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); say("brief-msg", "Press Ctrl+C or Cmd+C to copy.", ""); }
  }
  else if (act === "download-brief") download(`${slug()}-brief.md`, last.brief, "text/markdown");
  else if (act === "copy-json") {
    try { await navigator.clipboard.writeText(JSON.stringify(P, null, 2)); say("brief-msg", "Plan JSON copied.", "ok"); } catch { say("brief-msg", "Copy was blocked here.", "bad"); }
  }
  else if (act === "export") download(`${slug()}-plan.json`, JSON.stringify(P, null, 2), "application/json");
  else if (act === "import") $("#import-file").click();
  else if (act === "rel-new") {
    addRelease(blankPlan(Date.now(), P.release.type));
    sayRel("New release. Name it and set the dates, then add tickets or pull them from Jira.", false, "ok");
    $("#f-release-name")?.focus();
  }
  else if (act === "rel-next") {
    const from = P.release.name || "Untitled release";
    addRelease(nextPlan(P, Date.now()));
    sayRel(`Started the next release from “${from}”. People, environments and rollout settings carried over. Tickets, signals, checks and approvals are cleared.`, false, "ok");
    $("#f-release-name")?.focus();
  }
  else if (act === "rel-dup") {
    const c = JSON.parse(JSON.stringify(P));
    c.release.name = `Copy of ${P.release.name || "Untitled release"}`;
    addRelease(c);
    sayRel("Duplicated. Changes here do not affect the original.", false, "ok");
  }
  else if (act === "rel-example") { addRelease(defaultPlan()); sayRel("Loaded the example release as a new entry.", false, "ok"); }
  else if (act === "conflict-load" || act === "conflict-copy") {
    const id = lib.current;
    try {
      const res = await fetch("/api/releases/" + id, { headers: RH });
      if (res.status === 401) { toLogin(); return; }
      const mine = JSON.parse(JSON.stringify(P));
      if (res.ok) { adopt(await res.json()); P = lib.items[id]; }
      else { // it was deleted: keep mine as a new release
        delete remote.versions[id]; delete remote.pushed[id];
      }
      remote.conflict = null;
      if (act === "conflict-copy" || !res.ok) {
        mine.release.name = `${mine.release.name || "Untitled release"} (my edits)`;
        addRelease(mine);
        sayRel("Your edits are saved as a separate release.", false, "ok");
      } else {
        showRelease();
        sayRel("Loaded the latest version.", false, "ok");
      }
    } catch (err) { sayRel("Could not load it: " + err.message, false, "bad"); }
  }
  else if (act === "rel-delete") deleteRelease();
  else if (act === "rel-undo") {
    if (lastDeleted) {
      const { plan, idx } = lastDeleted; lastDeleted = null;
      lib.items[lib.current] = P;
      lib.items[plan.id] = plan;
      lib.order.splice(Math.min(idx, lib.order.length), 0, plan.id);
      openRelease(plan.id);
      sayRel(`Restored “${plan.release.name || "Untitled release"}”.`, false, "ok");
    }
  }
});

document.addEventListener("submit", (e) => {
  const f = e.target.closest("[data-form='waive']");
  if (!f) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(f));
  const approver = String(v.approver || "").trim(), reason = String(v.reason || "").trim();
  if (!approver) { waiveError = "Name the person who approves this waiver."; renderResults(); return; }
  if (reason.length < 8) { waiveError = "Give a reason of at least a few words."; renderResults(); return; }
  const crit = last.result.criteria.find((c) => c.id === f.dataset.id);
  P.waivers[f.dataset.id] = { approver, reason, at: new Date().toISOString(), statusAtWaive: crit.status };
  openWaive = null; waiveError = "";
  changed();
});

document.addEventListener("submit", (e) => {
  const f = e.target.closest("[data-form^='add-']");
  if (!f) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(f));
  const label = String(v.label || "").trim(), name = String(v.name || "").trim();
  const err = f.querySelector(".err");
  if (!label) { err.textContent = f.dataset.form === "add-person" ? "Give the field a name, like Legal reviewer." : "Give the role a name, like Legal."; err.hidden = false; f.querySelector("input[name=label]").focus(); return; }
  if (f.dataset.form === "add-person") {
    (P.extraPeople ||= []).push({ label, name });
    addOpen = null; renderExtraPeople(); renderPeopleList();
  } else {
    P.signoffs.push({ role: label, who: name, approved: v.approved === "true" });
    addOpen = null; renderSignoffs();
  }
  changed();
});

$("#rel-select").addEventListener("change", (e) => openRelease(e.target.value));

$("#import-file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    const p = JSON.parse(await file.text());
    if (!p || !Array.isArray(p.tickets) || !p.release) throw new Error("That file is not a release plan.");
    addRelease(fillDefaults(FILL(), p));
    sayRel(`Imported “${P.release.name || "Untitled release"}” as a new release.`, false, "ok");
  } catch (err) {
    $("#results").insertAdjacentHTML("afterbegin", `<div class="banner bad" role="alert"><strong>Could not import.</strong><span>${esc(err.message)}</span></div>`);
  }
});

(async function init() {
  let offline = false;
  if (!STANDALONE) {
    try {
      const res = await fetch("/api/releases");
      if (res.status === 401) { toLogin(); return; }
      if (res.ok) startRemote(await res.json());
      else offline = true;
    } catch { offline = true; }
  }
  renderInputs();
  renderResults();
  saveLib();
  if (READONLY) {
    document.body.classList.add("ro");
    for (const el of [$("#inputs"), $(".relbar .toolbar")]) if (el) el.inert = true;
    setSaveState("View only");
  }
  if (STANDALONE) return; // no server behind a single-file copy
  if (offline) sayRel("Could not reach the server, so changes are saved only in this browser.", false, "bad");
  else if (remote) {
    if (readOnly()) { const i = $("#inputs"); if (i) i.inert = true; }
    setInterval(pollServer, 20000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) pollServer(); });
  }
  try {
    const res = await fetch("/api/config");
    if (res.ok) { const cfg = await res.json(); integrations = { jira: Boolean(cfg.integrations?.jira), server: true }; updateJiraButton(); }
  } catch { /* no server, planner still works on its own */ }

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Release Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #f1f4f3; --surface: #ffffff; --surface-2: #f6f8f7; --ink: #15201c; --muted: #5a6a64; --line: #d8e0dc;
  --accent: #0e6b5c; --accent-ink: #ffffff;
  --good: #1b7a49; --good-bg: #e0f2e8; --warn: #8f5a00; --warn-bg: #fbefd2;
  --bad: #b3261e; --bad-bg: #fbe2df; --pend: #3f56a0; --pend-bg: #e3e8f7; --waive: #6a4a8c; --waive-bg: #ece3f5;
  --font-body: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1412; --surface: #151f1c; --surface-2: #1b2723; --ink: #e6efeb; --muted: #93a59e; --line: #2a3a35;
    --accent: #4fc3ab; --accent-ink: #082019;
    --good: #5fd38f; --good-bg: #173326; --warn: #f0b84d; --warn-bg: #3a2c0e;
    --bad: #ff8a80; --bad-bg: #3d1a17; --pend: #9db0ee; --pend-bg: #1d2644; --waive: #c9a8ee; --waive-bg: #2c2040;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1412; --surface: #151f1c; --surface-2: #1b2723; --ink: #e6efeb; --muted: #93a59e; --line: #2a3a35;
  --accent: #4fc3ab; --accent-ink: #082019;
  --good: #5fd38f; --good-bg: #173326; --warn: #f0b84d; --warn-bg: #3a2c0e;
  --bad: #ff8a80; --bad-bg: #3d1a17; --pend: #9db0ee; --pend-bg: #1d2644; --waive: #c9a8ee; --waive-bg: #2c2040;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-body); padding: 20px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
a { color: var(--accent); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
.title h1 { font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
.title .sub { color: var(--muted); font-size: 12px; margin-top: 4px; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { font-family: var(--font-data); font-size: 11px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); background: var(--surface); }
.tag.sample { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
.tag.on { color: var(--good); border-color: var(--good); }
.tag.err { color: var(--bad); border-color: var(--bad); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.note { color: var(--muted); font-size: 12px; }

.controls { flex-direction: row; flex-wrap: wrap; align-items: flex-end; gap: 12px; }
.controls label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; flex: 1 1 150px; min-width: 0; }
.controls input, .form input, .form textarea { text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 400; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; min-width: 0; }
.controls input:disabled { opacity: .5; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface-2); padding: 7px 12px; font-size: 13px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 11px; font-size: 13px; font-weight: 500; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { color: var(--accent-ink); filter: brightness(1.08); }
.btn.small { padding: 3px 9px; font-size: 12px; }

#banner:empty { display: none; }
.banner { border: 1px solid var(--warn); background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; }
.banner.bad { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.banner ul { margin: 0; padding-left: 18px; }

.verdict { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; display: grid; grid-template-columns: minmax(220px, 300px) 1fr; overflow: hidden; }
.v-badge { padding: 20px 22px; display: flex; flex-direction: column; gap: 6px; justify-content: center; min-width: 0; }
.v-badge .label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; opacity: .85; }
.v-badge .word { font-family: var(--font-data); font-size: 40px; font-weight: 600; line-height: 1; letter-spacing: -.02em; }
.v-badge.nogo { background: var(--bad-bg); color: var(--bad); }
.v-badge.hold { background: var(--warn-bg); color: var(--warn); }
.v-badge.go { background: var(--good-bg); color: var(--good); }
.v-body { padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.tally { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-data); font-size: 12px; padding: 3px 9px; border-radius: 999px; font-weight: 500; white-space: nowrap; }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }
.s-pass { color: var(--good); background: var(--good-bg); }
.s-warn { color: var(--warn); background: var(--warn-bg); }
.s-fail { color: var(--bad); background: var(--bad-bg); }
.s-pending { color: var(--pend); background: var(--pend-bg); }
.s-waived { color: var(--waive); background: var(--waive-bg); }
.holding h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
.holding ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.holding li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.holding li .mono { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.progress { height: 8px; border-radius: 4px; background: var(--surface-2); display: flex; overflow: hidden; border: 1px solid var(--line); }
.progress span, .bar span { display: block; height: 100%; }
.p-pass { background: var(--good); } .p-warn { background: var(--warn); } .p-fail { background: var(--bad); } .p-pending { background: var(--pend); } .p-waived { background: var(--waive); }

.criteria { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 10px; }
.crit { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px; background: var(--surface-2); min-width: 0; }
.crit .row1 { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.crit .name { font-weight: 600; }
.crit .detail { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.crit .waiver-note { font-size: 12px; color: var(--waive); background: var(--waive-bg); border-radius: 6px; padding: 6px 8px; }
.crit .waiver-note.stale { color: var(--bad); background: var(--bad-bg); }
.crit .foot { display: flex; flex-direction: column; gap: 6px; margin-top: 2px; }
.crit .src { font-family: var(--font-data); font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.crit .btns { display: flex; gap: 6px; flex-wrap: wrap; }
.form { display: flex; flex-direction: column; gap: 6px; border-top: 1px dashed var(--line); padding-top: 8px; }
.form label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; display: flex; flex-direction: column; gap: 3px; }
.form textarea { resize: vertical; min-height: 54px; }
.form .err { color: var(--bad); font-size: 12px; }
.form .row { display: flex; gap: 6px; }

.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 10px; font-family: var(--font-data); font-size: 12px; }
.filters button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.t { min-width: 200px; }
td .id { font-family: var(--font-data); font-size: 12px; color: var(--muted); display: block; }
.empty { color: var(--muted); padding: 8px 0; }
.sev { font-family: var(--font-data); font-weight: 600; font-size: 12px; padding: 2px 7px; border-radius: 4px; }
.sev-P0 { background: var(--bad); color: var(--bg); }
.sev-P1 { background: var(--warn-bg); color: var(--warn); }
.sev-P2 { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.num { text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; padding-right: 0; white-space: nowrap; }

.appr-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; }
.appr-row:last-child { border-bottom: 0; }

.stage { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: center; margin-bottom: 10px; }
.stage .val { font-family: var(--font-data); font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.bar { height: 10px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); display: flex; overflow: hidden; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-top: 6px; }
.stat { display: flex; flex-direction: column; }
.stat b { font-family: var(--font-data); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.failnames { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--font-data); font-size: 11px; fill: var(--muted); }
@media (max-width: 560px) { .verdict { grid-template-columns: 1fr; } .stage { grid-template-columns: 1fr auto; } .stage .bar { grid-column: 1 / -1; order: 3; } }
@media (prefers-reduced-motion: no-preference) { .progress span, .bar span { transition: width .3s ease; } }

/* ---------- navigation ---------- */
.nav { display: flex; flex-wrap: wrap; gap: 4px; }
.nav a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: 13px; padding: 5px 11px; border-radius: 6px; border: 1px solid transparent; }
.nav a:hover { color: var(--ink); border-color: var(--line); }
.nav a[aria-current="page"] { color: var(--accent-ink); background: var(--accent); }

/* ---------- planner ---------- */
.sumbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 11; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.sumbar .call { font-family: var(--font-data); font-weight: 600; font-size: 15px; padding: 3px 10px; border-radius: 6px; }
.sumbar .call.nogo { background: var(--bad-bg); color: var(--bad); }
.sumbar .call.hold { background: var(--warn-bg); color: var(--warn); }
.sumbar .call.go { background: var(--good-bg); color: var(--good); }
.sumbar .kv { display: flex; flex-direction: column; line-height: 1.15; }
.sumbar .kv b { font-family: var(--font-data); font-size: 14px; font-variant-numeric: tabular-nums; }
.sumbar .kv span { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.sumbar .spacer { flex: 1 1 auto; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; }

.plan { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.plan > .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.results { position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow-y: auto; padding-right: 2px; }
@media (max-width: 1100px) { .plan { grid-template-columns: minmax(0, 1fr); } .results { position: static; max-height: none; overflow: visible; } }

.sec-head { display: flex; flex-direction: column; gap: 2px; }
.sec-head .hint { color: var(--muted); font-size: 12px; text-transform: none; letter-spacing: 0; font-weight: 400; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); gap: 10px 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field > label, .field > .lab { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.field input[type="text"], .field input[type="number"], .field input[type="datetime-local"], .field select, .field textarea,
.tbl input[type="text"], .tbl input[type="number"], .tbl input[type="datetime-local"], .tbl select {
  font: inherit; font-size: 13px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; min-width: 0;
}
.field textarea { resize: vertical; min-height: 58px; line-height: 1.4; }
.field .mono, .tbl .mono { font-family: var(--font-data); font-size: 12px; }
.field .suffix { font-size: 11px; color: var(--muted); }
.field .help { font-size: 11px; color: var(--muted); }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; padding-top: 2px; }
.checks label { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; text-transform: none; letter-spacing: 0; color: var(--ink); font-weight: 400; }
.checks input { width: 16px; height: 16px; accent-color: var(--accent); }
.inline { display: flex; gap: 8px; align-items: flex-end; }
.inline > :first-child { flex: 1 1 auto; min-width: 0; }
.signoff { display: grid; grid-template-columns: minmax(72px, 0.5fr) minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 3px 0; }
.signoff .role { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.signoff input[type="text"] { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; min-width: 0; }
.signoff label.checks { font-size: 13px; white-space: nowrap; }

.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { padding: 4px 6px 6px 0; }
.tbl td { padding: 4px 6px 4px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.c { text-align: center; }
.tbl input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
.tbl .k { width: 92px; } .tbl .s { min-width: 220px; } .tbl .ty { width: 84px; } .tbl .pr { width: 66px; } .tbl .pt { width: 62px; }
.tbl .st { width: 118px; } .tbl .as { width: 110px; } .tbl .ar { width: 100px; } .tbl .x { width: 30px; }
.tbl .tm { width: 112px; } .tbl .bb { width: 150px; } .tbl .warn-in { border-color: var(--warn); background: var(--warn-bg); }
.tbl .ph { width: 108px; } .tbl .ow { width: 140px; } .tbl .wh { width: 190px; }
.row-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.msg { font-size: 12px; color: var(--muted); }
.msg.ok { color: var(--good); } .msg.bad { color: var(--bad); }
.icon-btn { border: 1px solid transparent; background: transparent; color: var(--muted); border-radius: 6px; padding: 2px 7px; font-size: 15px; line-height: 1; }
.icon-btn:hover { color: var(--bad); border-color: var(--line); }
.tpl-note { font-size: 12px; color: var(--muted); }

/* results */
.rc { display: flex; flex-direction: column; gap: 16px; }
.risk-head { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.risk-score { font-family: var(--font-data); font-size: 44px; font-weight: 600; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.risk-score small { font-size: 15px; color: var(--muted); font-weight: 400; }
.risk-level { font-weight: 700; font-size: 15px; }
.lvl-Low { color: var(--good); } .lvl-Moderate { color: var(--warn); } .lvl-High, .lvl-Critical { color: var(--bad); }
.meter { position: relative; height: 10px; border-radius: 5px; display: flex; overflow: hidden; margin: 8px 0 2px; }
.meter span { flex: 1; } .meter .m1 { background: var(--good); } .meter .m2 { background: var(--warn); } .meter .m3 { background: var(--bad); opacity: .65; } .meter .m4 { background: var(--bad); }
.meter-wrap { position: relative; flex: 1 1 200px; min-width: 160px; }
.meter-mark { position: absolute; top: 4px; width: 4px; height: 18px; border-radius: 2px; background: var(--ink); transform: translateX(-50%); box-shadow: 0 0 0 2px var(--surface); }
.meter-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); font-family: var(--font-data); }
.factor { display: grid; grid-template-columns: minmax(0, 1fr) 54px; gap: 2px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.factor:last-child { border-bottom: 0; }
.factor .fl { font-weight: 600; }
.factor .fv { font-family: var(--font-data); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.factor .fb { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.factor .fb i { display: block; height: 100%; border-radius: 3px; }
.factor .fd { grid-column: 1 / -1; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.recs { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.ladder { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ladder .step { font-family: var(--font-data); font-size: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; }
.ladder .arrow { color: var(--muted); }
.pts-stack { display: flex; height: 14px; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
.pts-stack span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
.area-row { display: grid; grid-template-columns: 90px 1fr 56px; gap: 8px; align-items: center; font-size: 12px; }
.area-row .fb { height: 8px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.area-row .fb i { display: block; height: 100%; background: var(--good); }
.crow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: start; }
.crow:last-child { border-bottom: 0; }
.crow .cn { font-weight: 600; }
.crow .cd { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.crow .adv { font-family: var(--font-data); font-size: 10px; color: var(--muted); letter-spacing: .05em; margin-left: 6px; }
.crow .wn { grid-column: 2 / -1; font-size: 12px; color: var(--waive); background: var(--waive-bg); border-radius: 6px; padding: 5px 8px; }
.crow .wn.stale { color: var(--bad); background: var(--bad-bg); }
.crow .wf { grid-column: 1 / -1; }
.brief { font-family: var(--font-data); font-size: 12px; line-height: 1.5; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 360px; overflow-y: auto; }
.pill-ok { color: var(--good); } .pill-warn { color: var(--warn); } .pill-bad { color: var(--bad); }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
@media (max-width: 700px) { .sumbar { position: static; } }

// Pure functions, no I/O. Runs in Node and in the browser.
//
// Two kinds of dependency are tracked:
//  - a ticket is blocked by other tickets in this release (ticket.blockedBy, a list of keys)
//  - a handoff between teams (design to frontend, devops to QA) that blocks named tickets

    longestChain: { length: longest.len, keys: longest.keys },
    outside: [...outside],

  else control = `<input id="${id}" class="${mono.trim()}" type="text" data-p="${f.p}" value="${esc(v)}" placeholder="${esc(f.ph || "")}" autocomplete="off">`;
  const after = f.after === "tpl"
    ? `<div class="row-actions"><button class="btn small" type="button" data-act="apply-template">Apply defaults for this type</button><span class="tpl-note">Sets rollout, window, rollback time, sign-off roles and the runbook.</span></div>`
    : f.suffix ? `<span class="suffix">${esc(f.suffix)}</span>` : "";
  return `<div class="${cls}"><label for="${id}">${esc(f.l)}</label>${control}${after}</div>`;
}

/** A note when a "blocked by" names a ticket that is not in this release. */
function blockedUnknown(t) {
  const known = new Set(P.tickets.map((x) => String(x.key).toUpperCase()));
  const bad = parseKeys(t.blockedBy).filter((k) => !known.has(k) && k !== String(t.key).toUpperCase());
  return bad.length ? `${bad.join(", ")} ${bad.length === 1 ? "is" : "are"} not in this release's ticket list, so ${bad.length === 1 ? "it counts" : "they count"} as unresolved.` : "";
}

/* ---------- library actions ---------- */

function relLabel(p, now) {
  let tail = "";
  try {
    const r = evaluate(planToSnapshot(p, now), planConfig(p), planState(p));
    tail = ` · ${r.verdict.call} · risk ${computeRisk(p, now).score}`;
  } catch { /* a broken plan still gets a name */ }
  return (p.release.name || "Untitled release") + tail;
}

function renderRelSelect() {
  const now = Date.now(), sel = $("#rel-select");
  if (!sel) return;
  sel.innerHTML = lib.order.filter((id) => lib.items[id] || id === lib.current).map((id) => `<option value="${esc(id)}"${id === lib.current ? " selected" : ""}>${esc(relLabel(id === lib.current ? P : lib.items[id], now))}</option>`).join("");
}

function showRelease() {
  openWaive = null; waiveError = "";
  if (remote) store.set("rr.current", lib.current);
  saveLib();
  renderInputs();
  renderResults();
}

function openRelease(id) {
  if (!lib.items[id]) return;
  lib.items[lib.current] = P;
  lib.current = id;
  P = lib.items[id];
  showRelease();
}

function addRelease(plan) {
  plan.id = newId();
  lib.items[lib.current] = P;
  lib.items[plan.id] = plan;
  lib.order.push(plan.id);
  lib.current = plan.id;
  P = plan;
  showRelease();
}

let lastDeleted = null;
function deleteRelease() {
  const id = lib.current, idx = lib.order.indexOf(id), name = P.release.name || "Untitled release";
  lastDeleted = { plan: P, idx };
  lib.order.splice(idx, 1);
  delete lib.items[id];
  if (remote) removeRemote(id);
  if (!lib.order.length) { const b = { ...blankPlan(Date.now(), P.release.type), id: newId() }; lib.items[b.id] = b; lib.order.push(b.id); }
  lib.current = lib.order[Math.min(idx, lib.order.length - 1)];
  P = lib.items[lib.current];
  showRelease();
  sayRel(`Deleted “${name}”.`, true);
}

function sayRel(text, undo = false, kind = "") {
  const el = $("#rel-msg");
  el.className = "msg " + kind;
  el.innerHTML = esc(text) + (undo ? ` <button class="btn small" type="button" data-act="rel-undo">Undo</button>` : "");
}

/* ---------- results ---------- */

function compute() {
  const now = Date.now();
  const snapshot = planToSnapshot(P, now);
  const result = evaluate(snapshot, planConfig(P), planState(P));
  const risk = computeRisk(P, now);
  const deps = analyzeDependencies(P.tickets, P.handoffs, now, Date.parse(P.when.freezeAt) || null);
  const model = reportModel(P, result, risk, now);
  return { now, result, risk, deps, model, brief: briefMarkdown(P, result, risk, now) };
}

function renderSumbar({ result, risk, now }) {
  const v = result.verdict, cls = { "NO-GO": "nogo", HOLD: "hold", GO: "go" }[v.call];
  const deploy = Date.parse(P.when.deployAt);
  const days = Number.isNaN(deploy) ? "not set" : deploy < now ? "passed" : `${Math.max(0, Math.round(((deploy - now) / 86400000) * 10) / 10)} d`;
  const kv = (b, s, c = "") => `<div class="kv"><b class="${c}">${esc(b)}</b><span>${esc(s)}</span></div>`;
  $("#sumbar").innerHTML =
    `<span class="call ${cls}">${esc(v.call)}</span>` +
    kv(`${risk.score}/100`, `Risk · ${risk.level}`, `lvl-${risk.level}`) +
    kv(`${risk.points.pctDone}%`, `Points done · ${risk.points.done}/${risk.points.total}`) +
    kv(days, "To deploy") +
    kv(`${v.counts.fail + v.counts.warn + v.counts.pending}`, "Criteria open") +
    `<span class="spacer"></span><div class="toolbar">${agentBarBtn()}${STANDALONE ? `<button class="btn small" type="button" data-act="copy-json">Copy plan JSON</button>` : `<button class="btn small" type="button" data-act="export">Export plan</button>`}</div>`;
}


// RAID: what the panel on the right shows. Rule-based suggestions are worked out every time; AI ones are kept until the release changes.
const RA = { forId: "", ai: [], busy: false, msg: "" };
function raidPanel(clashes) {
  if (RA.forId !== lib.current) Object.assign(RA, { forId: lib.current, ai: [], busy: false, msg: "" });
  const now = Date.now(), taken = new Set([...(P.raid || []).map((r) => r.source), ...(P.raidDismissed || [])]);
  const suggestions = [...suggestRaid(P, { now, clashes }), ...RA.ai.filter((x) => !taken.has(x.source))];
  const open = (P.raid || []).filter((r) => !isClosedRaid(r)).map((r) => ({ ...r, overdue: isOverdue(r, now) }))
    .sort((a, b) => Number(b.overdue) - Number(a.overdue) || RAID_RATINGS.indexOf(a.rating) - RAID_RATINGS.indexOf(b.rating)).slice(0, 5);
  RA.suggestions = suggestions;
  return renderRaid(summarizeRaid(P.raid || [], now), open, suggestions, { canEdit: !READONLY && !readOnly(), canAi: Boolean(remote && integrations.server), busy: RA.busy, msg: RA.msg });
}

let last = null;
function renderResults() {
  try {
    last = compute();
  } catch (e) {
    $("#results").innerHTML = `<div class="banner bad"><strong>Could not compute the results.</strong><span>${esc(e.message)}</span></div>`;
    return;
  }
  renderSumbar(last);
  if (remote && integrations.server && AG.forId !== lib.current) agentLoad();
  const fresh = !P.release.name.trim() && P.tickets.length === 0 && !Number(P.signals.ci.total);
  const roNote = READONLY ? `<div class="banner"><strong>View only.</strong><span>This is an example release with invented names and numbers. You can look at everything, but nothing can be changed or saved.</span></div>` : "";
  const closedNote = isClosed(P) ? `<div class="banner"><strong>Closed: ${esc(P.outcome.status)}.</strong><span>Auto-refresh and alerts are off for this release. Clear the outcome under After the release to reopen it.</span></div>` : "";
  const clashes = isClosed(P) || READONLY ? [] : conflictsFor(buildSchedule(lib.order.map((id) => ({ ...(id === lib.current ? P : lib.items[id]), id })), { now: Date.now() }), lib.current);
  const clashNote = renderClashBanner(clashes, lib.current, { calendarHref: STANDALONE ? "" : "/calendar.html" });
  const note = roNote + closedNote + clashNote + (fresh ? `<div class="banner"><strong>New release.</strong><span>Name it and set the dates on the left, then add tickets or pull them from Jira. The call stays HOLD until the checks have data, and anything unknown counts as risk.</span></div>` : "");
  renderRelSelect();

function onEdit(e) {
  const el = e.target.closest("[data-p]");
  if (!el || !el.isConnected) return; // a field that was just redrawn can still fire a late change; it must not write into the new release
  const parent = el.dataset.p.split(".").slice(0, -1).reduce((a, k) => (a == null ? a : a[k]), P);
  if (parent == null || typeof parent !== "object") return;
  if (el.dataset.multi) {
    setPath(P, el.dataset.p, [...document.querySelectorAll(`[data-multi][data-p="${el.dataset.p}"]:checked`)].map((x) => x.value));
  } else if (el.type === "radio") {
    if (el.checked) setPath(P, el.dataset.p, el.value === "true");
  } else if (el.type === "checkbox") {
    setPath(P, el.dataset.p, el.checked);
    const lab = el.closest("label");
    if (lab && el.dataset.p === "how.flagsDefaultOff") lab.lastChild.textContent = el.checked ? " Yes" : " No";
  } else if (el.type === "number") {
    setPath(P, el.dataset.p, el.value === "" ? 0 : Number(el.value));
  } else {
    setPath(P, el.dataset.p, el.value);
  }
  if (/^(people|extraPeople)\./.test(el.dataset.p)) renderPeopleList();
  if (el.dataset.p === "release.tracker") updateJiraButton();
  const rt = /^raid\.(\d+)\.type$/.exec(el.dataset.p);
  if (rt) { const r = P.raid[Number(rt[1])]; r.status = RAID_STATUS[r.type][0]; renderRaidTable(); }
  else if (/^raid\.\d+\.(status|due)$/.test(el.dataset.p)) renderRaidTable();
  if (el.dataset.p === "outcome.status" && applyOutcomeChange(P, Date.now())) { const at = $("#f-outcome-at"); if (at) at.value = P.outcome.at || ""; }
  changed();
}

async function fetchTracker(say_) {
  const t = curTracker(), version = P.release.fixVersion.trim();

    const res = await fetch(`/api/tickets?tracker=${encodeURIComponent(t.id)}&version=${encodeURIComponent(version)}`);

    if (!res.ok) throw new Error(body.error || `Request failed (${res.status}).`);

    say("jira-msg", e.message, "bad");

      sayRel(`Restored “${plan.release.name || "Untitled release"}”.`, false, "ok");
    }
  }
});

document.addEventListener("submit", (e) => {
  const f = e.target.closest("[data-form='waive']");
  if (!f) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(f));
  const approver = String(v.approver || "").trim(), reason = String(v.reason || "").trim();
  if (!approver) { waiveError = "Name the person who approves this waiver."; renderResults(); return; }
  if (reason.length < 8) { waiveError = "Give a reason of at least a few words."; renderResults(); return; }
  const crit = last.result.criteria.find((c) => c.id === f.dataset.id);
  P.waivers[f.dataset.id] = { approver, reason, at: new Date().toISOString(), statusAtWaive: crit.status };
  openWaive = null; waiveError = "";
  changed();
});

document.addEventListener("submit", (e) => {
  const f = e.target.closest("[data-form^='add-']");
  if (!f) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(f));
  const label = String(v.label || "").trim(), name = String(v.name || "").trim();
  const err = f.querySelector(".err");
  if (!label) { err.textContent = f.dataset.form === "add-person" ? "Give the field a name, like Legal reviewer." : "Give the role a name, like Legal."; err.hidden = false; f.querySelector("input[name=label]").focus(); return; }
  if (f.dataset.form === "add-person") {
    (P.extraPeople ||= []).push({ label, name });
    addOpen = null; renderExtraPeople(); renderPeopleList();
  } else {
    P.signoffs.push({ role: label, who: name, approved: v.approved === "true" });
    addOpen = null; renderSignoffs();
  }
  changed();
});

$("#rel-select").addEventListener("change", (e) => openRelease(e.target.value));

$("#import-file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    const p = JSON.parse(await file.text());
    if (!p || !Array.isArray(p.tickets) || !p.release) throw new Error("That file is not a release plan.");
    addRelease(tidy(p));
    sayRel(`Imported “${P.release.name || "Untitled release"}” as a new release.`, false, "ok");
  } catch (err) {
    $("#results").insertAdjacentHTML("afterbegin", `<div class="banner bad" role="alert"><strong>Could not import.</strong><span>${esc(err.message)}</span></div>`);
  }
});

/* ---------- start ---------- */

(async function init() {
  let offline = false;
  if (!STANDALONE) {
    try {
      const res = await fetch("/api/releases");
      if (res.status === 401) { toLogin(); return; }
      if (res.ok) startRemote(await res.json());
      else offline = true;
    } catch { offline = true; }
  }
  renderInputs();
  renderResults();
  saveLib();
  if (READONLY) {
    document.body.classList.add("ro");
    for (const el of [$("#inputs"), $(".relbar .toolbar")]) if (el) el.inert = true;
    setSaveState("View only");
  }
  if (STANDALONE) return; // no server behind a single-file copy
  if (offline) sayRel("Could not reach the server, so changes are saved only in this browser.", false, "bad");
  else if (remote) {
    if (readOnly()) { const i = $("#inputs"); if (i) i.inert = true; }
    setInterval(pollServer, 20000);
    setInterval(showSync, 30000); showSync(); setInterval(() => { if (!document.hidden) agentLoad(); }, 30000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) pollServer(); });
  }
  try {
    const res = await fetch("/api/config");
    if (res.ok) { const cfg = await res.json(); integrations = { jira: Boolean(cfg.integrations?.jira), server: true, ai: cfg.integrations?.ai || "", trackers: Array.isArray(cfg.integrations?.trackers) ? cfg.integrations.trackers : undefined }; updateJiraButton(); renderResults(); }
  } catch { /* no server, planner still works on its own */ }
})();

})();
</script>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAID log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="title"><h1>RAID log</h1><div class="sub mono">Risks, assumptions, issues and dependencies across every release.</div></div>
      <nav class="nav" aria-label="Pages"><a href="/">Dashboard</a><a href="/plan.html">Planner</a><a href="/calendar.html">Calendar</a><a href="/raid.html" aria-current="page">RAID</a><a href="/inbox.html" data-inbox>Inbox</a></nav>
    </header>
    <div class="banner bad" id="err" role="alert" hidden></div>
    <section class="panel" aria-label="RAID items">
      <div id="summary"></div>
      <div class="raid-filters">
        <label class="note">Type <select id="f-type"><option value="">All</option><option>Risk</option><option>Assumption</option><option>Issue</option><option>Dependency</option></select></label>
        <label class="note">Rating <select id="f-rating"><option value="">All</option><option>High</option><option>Medium</option><option>Low</option></select></label>
        <label class="note">Owner <select id="f-owner"><option value="">Everyone</option></select></label>
        <label class="note">Release <select id="f-release"><option value="">All open releases</option></select></label>
        <label class="note"><input type="checkbox" id="f-closed"> Include closed items and releases</label>
      </div>
      <div id="table"><p class="note">Loading…</p></div>
    </section>
  </div>
  <script src="/session.js"></script>
  <script type="module" src="/raid-page.js"></script>
</body>
</html>
